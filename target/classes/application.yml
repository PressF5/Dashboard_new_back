server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: dashboard-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dashboard}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
app:
  time-zone: ${APP_TIME_ZONE:Europe/Moscow}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:change-me}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}