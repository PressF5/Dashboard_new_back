server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: dashboard-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dashboard}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
app:
  time-zone: ${APP_TIME_ZONE:Europe/Moscow}
  jwt:
    issuer: dashboard-api
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    secret: ${JWT_SECRET}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}